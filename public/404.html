<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>リダイレクト中...</title>
    <script>
      // GitHub Pages SPA対応
      // サブパスへの直接アクセス時に index.html へリダイレクトし、
      // クライアントサイドルーティングで正しいページを表示する
      var pathSegmentsToKeep = 1; // /badminton-manager/ の1セグメント分を維持
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
