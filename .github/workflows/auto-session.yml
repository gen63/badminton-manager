name: Auto Create Session

on:
  schedule:
    # 21:00 UTC = 06:00 JST
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日（本番書き込みあり）: tomorrow=翌日 / nearest=直近の練習日'
        type: choice
        options:
          - tomorrow
          - nearest
        default: tomorrow
      force:
        description: '不明点があっても強制的にセッションを作成する'
        type: boolean
        default: false

jobs:
  create-session:
    runs-on: ubuntu-latest
    # E-ToMo/GAS への fetch はリトライ込みで1回あたり最大約2分待つ。
    # 対象イベントが複数あっても収まるよう余裕を持たせる。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run auto-session script
        env:
          ETOMO_URL: ${{ secrets.ETOMO_URL }}
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TARGET_DATE: ${{ inputs.target_date || 'tomorrow' }}
          FORCE_CREATE: ${{ inputs.force || 'false' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          TZ: Asia/Tokyo
        run: npx tsx scripts/auto-create-session.ts
